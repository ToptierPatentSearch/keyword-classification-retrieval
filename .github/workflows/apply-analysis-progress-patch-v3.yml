name: Apply analysis progress patch v3

on:
  push:
    branches:
      - codex/backend-analysis-progress
    paths:
      - scripts/run_analysis_progress_patch_v3.py

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply focused source patch
        run: python scripts/run_analysis_progress_patch_v3.py

      - name: Verify frontend build
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify analyze Edge Function
        run: deno check supabase/functions/analyze/index.ts

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/src/App.tsx \
            app/src/analysis-slideshow.css \
            app/src/analysisProgress.ts \
            app/src/components/AnalysisProgress.tsx \
            supabase/functions/analyze/index.ts \
            supabase/migrations/20260809090000_create_analysis_progress.sql
          git rm -- \
            .github/workflows/apply-analysis-progress-patch.yml \
            .github/workflows/apply-analysis-progress-patch-v2.yml \
            .github/workflows/apply-analysis-progress-patch-v3.yml \
            scripts/apply_analysis_progress_patch.py \
            scripts/run_analysis_progress_patch.py \
            scripts/run_analysis_progress_patch_v3.py
          git commit -m "Add backend analysis progress stages"
          git push origin HEAD:${{ github.ref_name }}
