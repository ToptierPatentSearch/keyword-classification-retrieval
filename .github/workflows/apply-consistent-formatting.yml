name: Apply consistent CPC and quotation formatting

on:
  push:
    branches:
      - fix/consistent-cpc-quote-formatting

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/consistent-cpc-quote-formatting

      - name: Apply focused source changes
        shell: python
        run: |
          from pathlib import Path

          app_path = Path("app/src/App.tsx")
          app = app_path.read_text(encoding="utf-8")

          time_import = 'import { formatLocalAndUtcTimestamp } from "./lib/time";'
          display_import = '''import {
            formatClassificationCodeForDisplay,
            removeWhitespaceAfterDoubleQuotes,
          } from "./lib/displayFormatting";'''

          assert time_import in app, "App time import was not found"
          assert display_import not in app, "Display formatter import already exists"
          app = app.replace(time_import, f"{time_import}\n{display_import}", 1)

          old_code = "<strong>{item.code}</strong>"
          new_code = (
            "<strong>"
            "{formatClassificationCodeForDisplay(item.code, item.system)}"
            "</strong>"
          )
          assert app.count(old_code) == 1, "Expected one RouteCodeCard code rendering"
          app = app.replace(old_code, new_code, 1)

          old_reason = (
            '<strong>Selection rationale:</strong> {keyword.reason}'
          )
          new_reason = (
            '<strong>Selection rationale:</strong>{" "}'
            '{removeWhitespaceAfterDoubleQuotes(keyword.reason)}'
          )
          assert app.count(old_reason) == 1, "Selection rationale rendering was not found"
          app = app.replace(old_reason, new_reason, 1)

          old_classification_reason = "{keyword.classification_reason}"
          new_classification_reason = (
            "{removeWhitespaceAfterDoubleQuotes(keyword.classification_reason)}"
          )
          assert app.count(old_classification_reason) == 1, (
            "Classification rationale rendering was not found"
          )
          app = app.replace(
            old_classification_reason,
            new_classification_reason,
            1,
          )
          app_path.write_text(app, encoding="utf-8")

          pdf_path = Path("app/src/pdf.ts")
          pdf = pdf_path.read_text(encoding="utf-8")

          search_import = '''import {
            buildSearchQueryStarter,
            SEARCH_QUERY_REVIEW_NOTICE,
          } from "./searchQuery";'''
          pdf_display_import = '''import {
            formatClassificationCodeForDisplay,
            removeWhitespaceAfterDoubleQuotes,
          } from "./lib/displayFormatting";'''
          assert search_import in pdf, "PDF search-query import was not found"
          assert pdf_display_import not in pdf, "PDF display formatter import already exists"
          pdf = pdf.replace(search_import, f"{search_import}\n{pdf_display_import}", 1)

          old_cpc_function = '''function formatCpcCodeForDisplay(code: string): string {
            const trimmed = code.trim();
            const compact = trimmed.replace(/\\s+/g, "");
            const match = compact.match(/^([A-HY]\\d{2}[A-Z])(\\d+\\/[0-9A-Z]+)$/i);

            return match ? `${match[1].toUpperCase()} ${match[2]}` : trimmed;
          }

          '''
          assert old_cpc_function in pdf, "Local CPC display formatter was not found"
          pdf = pdf.replace(old_cpc_function, "", 1)

          old_join = "? values.map(formatCpcCodeForDisplay).join(\", \")"
          new_join = (
            '? values\n'
            '        .map((value) => formatClassificationCodeForDisplay(value, "CPC"))\n'
            '        .join(", ")'
          )
          assert old_join in pdf, "CPC join formatter was not found"
          pdf = pdf.replace(old_join, new_join, 1)

          old_quote_function = '''function normalizeDoubleQuoteWhitespace(value: string): string {
            return value
              .replace(/”\\s+/g, "” ")
              .replace(/"\\s+/g, '" ')
              .replace(/“\\s+/g, "“")
              .replace(/(^|[\\s(\\[{])"\\s+/g, '$1"');
          }

          '''
          assert old_quote_function in pdf, "Local quotation formatter was not found"
          pdf = pdf.replace(old_quote_function, "", 1)

          old_reason_call = 'normalizeDoubleQuoteWhitespace(keyword.reason)'
          new_reason_call = 'removeWhitespaceAfterDoubleQuotes(keyword.reason)'
          assert pdf.count(old_reason_call) == 1, "PDF Reason formatter call was not found"
          pdf = pdf.replace(old_reason_call, new_reason_call, 1)
          pdf_path.write_text(pdf, encoding="utf-8")

          Path(".github/workflows/apply-consistent-formatting.yml").unlink()

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Build application
        working-directory: app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Test shared formatters
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          const {
            formatClassificationCodeForDisplay,
            removeWhitespaceAfterDoubleQuotes,
          } = await import('./app/src/lib/displayFormatting.ts');

          const checks = [
            [formatClassificationCodeForDisplay('H04W12/30', 'CPC'), 'H04W 12/30'],
            [formatClassificationCodeForDisplay('H04W 12/37', 'CPC'), 'H04W 12/37'],
            [formatClassificationCodeForDisplay('H04W12/03', 'IPC'), 'H04W 12/03'],
            [removeWhitespaceAfterDoubleQuotes('“ mobile devices”  is'), '“mobile devices”is'],
            [removeWhitespaceAfterDoubleQuotes('" mobile devices"  is'), '"mobile devices"is'],
          ];

          for (const [actual, expected] of checks) {
            if (actual !== expected) {
              throw new Error(`Expected ${JSON.stringify(expected)}, received ${JSON.stringify(actual)}`);
            }
          }
          NODE

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/App.tsx app/src/pdf.ts .github/workflows/apply-consistent-formatting.yml
          git commit -m "Use consistent CPC and quotation formatting"
          git push origin HEAD:fix/consistent-cpc-quote-formatting
