name: Apply robust keyword identity context gate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/keyword-identity-context-gate' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/keyword-identity-context-gate
          fetch-depth: 0

      - name: Apply robust patch
        run: python scripts/apply-keyword-identity-context-gate.py

      - name: Verify product change
        shell: bash
        run: |
          grep -n "keywordIdentityTokenKeys\|classificationTokenFamilyKey\|hasKeywordLexicalSupport\|keywordLexicalTerms" supabase/functions/analyze/index.ts
          git diff --check

      - name: Commit only product code
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/analyze/index.ts
          git rm -f .github/workflows/apply-keyword-identity-context-gate.yml
          git rm -f .github/workflows/trigger-keyword-identity-context-gate-pr.yml
          git rm -f .github/workflows/apply-keyword-identity-context-gate-pr-v2.yml
          git rm -f .github/.trigger-keyword-identity-context-gate
          git rm -f scripts/apply-keyword-identity-context-gate.py
          git commit -m "Exclude keyword identity from classification context"
          git push origin HEAD:agent/keyword-identity-context-gate
