# One-time branch patch; removed automatically after success.
name: Apply language-matched synonym output

on:
  push:
    branches:
      - agent/language-matched-synonyms
    paths:
      - .github/workflows/apply-language-matched-synonyms.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch synonym language handling
        shell: python
        run: |
          from pathlib import Path

          index_path = Path("supabase/functions/analyze/index.ts")
          helper_path = Path("supabase/functions/analyze/synonymLanguage.ts")
          test_path = Path("supabase/functions/analyze/synonymLanguage.test.ts")
          workflow_path = Path(".github/workflows/apply-language-matched-synonyms.yml")

          text = index_path.read_text(encoding="utf-8")

          replacements = [
              (
                  '} from "./searchQueryDomain.ts";\n\ntype Confidence',
                  '} from "./searchQueryDomain.ts";\nimport {\n  filterSynonymsByLanguage,\n  synonymMatchesLanguage,\n} from "./synonymLanguage.ts";\n\ntype Confidence',
              ),
              (
                  '): AnalysisResult {\n  const fallbackConceptTerm = Array.isArray(result.keywords)',
                  '): AnalysisResult {\n  const language: PatentLanguage = result.language === "ja" ? "ja" : "en";\n  const fallbackConceptTerm = Array.isArray(result.keywords)',
              ),
              (
                  '      const synonyms = cleanTextList(keyword.synonyms, 8).filter(\n        (synonym) =>\n          !excludedSynonyms.has(synonym.normalize("NFKC").toLowerCase()),\n      );',
                  '      const synonyms = filterSynonymsByLanguage(\n        cleanTextList(keyword.synonyms, 8).filter(\n          (synonym) =>\n            !excludedSynonyms.has(synonym.normalize("NFKC").toLowerCase()),\n        ),\n        language,\n        8,\n      );',
              ),
              (
                  '        (keyword.term || keyword.normalized_term) &&\n        keyword.concept_facets.length > 0 &&',
                  '        (keyword.term || keyword.normalized_term) &&\n        keyword.synonyms.length > 0 &&\n        keyword.concept_facets.length > 0 &&',
              ),
              (
                  '  return {\n    language: result.language === "ja" ? "ja" : "en",',
                  '  return {\n    language,',
              ),
              (
                  '        keyword.synonyms.every((synonym) => Boolean(synonym.trim())) &&',
                  '        keyword.synonyms.every(\n          (synonym) =>\n            Boolean(synonym.trim()) &&\n            synonymMatchesLanguage(synonym, result.language),\n        ) &&',
              ),
              (
                  '- For every retrieved keyword, derive and return 1-8 contextually valid synonyms, abbreviations, alternative technical names, English/Japanese equivalents, or established retrieval variants. The synonyms array must never be empty and must not repeat term or normalized_term.\n- For Japanese input, preserve Japanese wording in term and use an English technical phrase in normalized_term whenever possible.',
                  '- For every retrieved keyword, derive and return 1-8 contextually valid synonyms, abbreviations, alternative technical names, or established retrieval variants. The synonyms array must never be empty and must not repeat term or normalized_term.\n- The synonyms array must use only the detected dominant input language: Japanese synonyms for language=ja and English synonyms for language=en. Do not include translations or cross-language equivalents. For Japanese output, established Latin-script technical acronyms such as AI, EV, IoT, and LiDAR are allowed.\n- For Japanese input, preserve Japanese wording in term and use an English technical phrase in normalized_term whenever possible.',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected source fragment not found:\n{old}")
              text = text.replace(old, new, 1)

          index_path.write_text(text, encoding="utf-8")

          helper_path.write_text(
              '''export type SynonymLanguage = "en" | "ja";

const JAPANESE_SCRIPT_PATTERN =
  /[\\p{Script=Hiragana}\\p{Script=Katakana}\\p{Script=Han}]/u;
const LATIN_LETTER_PATTERN = /[A-Za-z]/u;
const TECHNICAL_ACRONYM_PATTERN =
  /^(?=.{2,16}$)(?=(?:.*[A-Z0-9]){2})[A-Za-z0-9]+(?:[+./-][A-Za-z0-9]+)*$/u;

export function synonymMatchesLanguage(
  value: string,
  language: SynonymLanguage,
): boolean {
  const normalized = value.normalize("NFKC").trim();
  if (!normalized) return false;

  const containsJapaneseScript = JAPANESE_SCRIPT_PATTERN.test(normalized);

  if (language === "ja") {
    return (
      containsJapaneseScript || TECHNICAL_ACRONYM_PATTERN.test(normalized)
    );
  }

  return !containsJapaneseScript && LATIN_LETTER_PATTERN.test(normalized);
}

export function filterSynonymsByLanguage(
  values: string[],
  language: SynonymLanguage,
  limit = 8,
): string[] {
  const filtered: string[] = [];
  const seen = new Set<string>();

  for (const value of values) {
    const normalized = value.normalize("NFKC").replace(/\\s+/gu, " ").trim();
    const comparisonKey = normalized.toLowerCase();

    if (
      !synonymMatchesLanguage(normalized, language) ||
      seen.has(comparisonKey)
    ) {
      continue;
    }

    seen.add(comparisonKey);
    filtered.push(normalized);

    if (filtered.length >= limit) break;
  }

  return filtered;
}
''',
              encoding="utf-8",
          )

          test_path.write_text(
              '''import {
  filterSynonymsByLanguage,
  synonymMatchesLanguage,
} from "./synonymLanguage.ts";

function assert(condition: boolean, message: string): void {
  if (!condition) throw new Error(message);
}

function assertEquals(actual: unknown, expected: unknown, message: string): void {
  const actualJson = JSON.stringify(actual);
  const expectedJson = JSON.stringify(expected);
  assert(actualJson === expectedJson, `${message}: ${actualJson} !== ${expectedJson}`);
}

Deno.test("Japanese synonym output excludes English translations", () => {
  assertEquals(
    filterSynonymsByLanguage(
      ["昇降機", "乗りかご", "elevator", "elevator car", "AI", "LiDAR"],
      "ja",
    ),
    ["昇降機", "乗りかご", "AI", "LiDAR"],
    "Japanese filtering",
  );
});

Deno.test("English synonym output excludes Japanese translations", () => {
  assertEquals(
    filterSynonymsByLanguage(
      ["elevator", "elevator car", "昇降機", "乗りかご", "EV"],
      "en",
    ),
    ["elevator", "elevator car", "EV"],
    "English filtering",
  );
});

Deno.test("language matcher accepts established Japanese technical acronyms", () => {
  assert(synonymMatchesLanguage("IoT", "ja"), "IoT should be accepted");
  assert(synonymMatchesLanguage("5G", "ja"), "5G should be accepted");
  assert(!synonymMatchesLanguage("sensor", "ja"), "English words should be rejected");
  assert(!synonymMatchesLanguage("センサ", "en"), "Japanese words should be rejected");
});
''',
              encoding="utf-8",
          )

          workflow_path.unlink()

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format changed TypeScript
        run: deno fmt supabase/functions/analyze/index.ts supabase/functions/analyze/synonymLanguage.ts supabase/functions/analyze/synonymLanguage.test.ts

      - name: Run synonym language tests
        run: deno test supabase/functions/analyze/synonymLanguage.test.ts

      - name: Type-check analyze function
        run: deno check supabase/functions/analyze/index.ts

      - name: Commit applied patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            supabase/functions/analyze/index.ts \
            supabase/functions/analyze/synonymLanguage.ts \
            supabase/functions/analyze/synonymLanguage.test.ts \
            .github/workflows/apply-language-matched-synonyms.yml
          git diff --cached --check
          git commit -m "Match synonym language to input"
          git push origin HEAD:agent/language-matched-synonyms
