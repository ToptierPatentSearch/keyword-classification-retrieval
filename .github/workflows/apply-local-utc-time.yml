name: Apply local and UTC time display

on:
  push:
    branches:
      - agent/use-jst-time-system
    paths:
      - .github/workflows/apply-local-utc-time.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch time display handling
        shell: python
        run: |
          from pathlib import Path
          import re

          workflow_path = Path(".github/workflows/apply-local-utc-time.yml")
          time_path = Path("app/src/lib/time.ts")

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def add_import(text: str, anchor: str, import_line: str) -> str:
              if import_line in text:
                  return text
              if anchor not in text:
                  raise SystemExit(f"Import anchor not found: {anchor}")
              return text.replace(anchor, f"{anchor}\n{import_line}", 1)

          def replace_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"Expected one replacement for {label}, found {count}")
              return updated

          time_path.write_text(
