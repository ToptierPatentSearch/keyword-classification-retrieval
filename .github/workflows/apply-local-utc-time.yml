name: Apply local and UTC time display

on:
  push:
    branches:
      - agent/use-jst-time-system
    paths:
      - .github/workflows/apply-local-utc-time.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch time display handling
        run: python .github/apply-local-utc-time.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: Build application
        run: npm run build
        working-directory: app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify obsolete GMT display logic is removed
        run: |
          ! grep -RIn --exclude='time.ts' 'standard: "GMT"\|timeZoneName: "short"' app/src

      - name: Commit applied patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/src/App.tsx \
            app/src/lib/time.ts \
            app/src/pages/admin/UserConsentsPage.tsx \
            app/src/pages/admin/UserActivityPage.tsx \
            app/src/pages/admin/UserPackagePurchasesPage.tsx \
            app/src/pages/admin/ErrorLogsPage.tsx \
            app/src/pages/admin/MaintenanceSettingsPage.tsx \
            app/src/components/RuntimeMaintenanceGate.tsx \
            .github/apply-local-utc-time.py \
            .github/workflows/apply-local-utc-time.yml
          git diff --cached --check
          git commit -m "Show user local time and UTC"
          git push origin HEAD:agent/use-jst-time-system
