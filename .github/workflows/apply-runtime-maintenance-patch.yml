name: Apply runtime maintenance patch

on:
  push:
    branches:
      - feature/runtime-maintenance-mode

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch analyze maintenance check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("supabase/functions/analyze/index.ts")
          source = path.read_text(encoding="utf-8")

          import_line = 'import { readMaintenanceStatus } from "./maintenance.ts";'
          import_anchor = '} from "./searchQueryDomain.ts";\n'

          if import_line not in source:
              if import_anchor not in source:
                  raise SystemExit("Unable to find the analyze import anchor.")
              source = source.replace(
                  import_anchor,
                  import_anchor + import_line + "\n",
                  1,
              )

          old_block = '''    const adminClient = createClient(supabaseUrl, supabaseServiceRoleKey, {
              auth: {
                persistSession: false,
                autoRefreshToken: false,
              },
            });

            auditStage = "request_validation";'''

          new_block = '''    const adminClient = createClient(supabaseUrl, supabaseServiceRoleKey, {
              auth: {
                persistSession: false,
                autoRefreshToken: false,
              },
            });

            auditStage = "maintenance_check";
            const maintenanceStatusResult = await readMaintenanceStatus(adminClient);

            if (!maintenanceStatusResult.ok) {
              throw new HttpError(503, maintenanceStatusResult.message);
            }

            if (maintenanceStatusResult.status.maintenanceEnabled) {
              const maintenanceStatus = maintenanceStatusResult.status;

              logAnalysisAudit("rejected", {
                stage: auditStage,
                user_id: auditUserId,
                status_code: 503,
                error_message: maintenanceStatus.message,
                duration_ms: Date.now() - analysisStartedAt,
              });

              return jsonResponse(
                {
                  error: maintenanceStatus.message,
                  code: "MAINTENANCE_MODE",
                  title: maintenanceStatus.title,
                  expectedBackAt: maintenanceStatus.expectedBackAt,
                },
                {
                  status: 503,
                  headers: {
                    "Retry-After": "300",
                  },
                },
              );
            }

            auditStage = "request_validation";'''

          if 'auditStage = "maintenance_check";' not in source:
              if old_block not in source:
                  raise SystemExit("Unable to find the analyze request-validation anchor.")
              source = source.replace(old_block, new_block, 1)

          path.write_text(source, encoding="utf-8")
          PY

      - name: Commit backend patch
        shell: bash
        run: |
          if git diff --quiet -- supabase/functions/analyze/index.ts; then
            echo "Analyze maintenance patch is already present."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- supabase/functions/analyze/index.ts
            git commit -m "Block analyze requests during maintenance [skip ci]"
            git push origin HEAD:feature/runtime-maintenance-mode
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build React application
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check analyze Edge Function
        run: deno check supabase/functions/analyze/index.ts
