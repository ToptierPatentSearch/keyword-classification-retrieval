name: Fix audit outcome type and validate classification gate

on:
  pull_request:
    branches:
      - main
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'agent/keyword-identity-context-gate' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/keyword-identity-context-gate
          fetch-depth: 0

      - name: Add missing replay audit outcome
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/analyze/index.ts')
          text = path.read_text(encoding='utf-8')
          old = '''type AnalysisAuditOutcome =
            | "started"
            | "ready"
            | "succeeded"
            | "failed"
            | "rejected";'''
          new = '''type AnalysisAuditOutcome =
            | "started"
            | "ready"
            | "replay"
            | "succeeded"
            | "failed"
            | "rejected";'''
          if old in text:
              text = text.replace(old, new, 1)
          elif '| "replay"' not in text[text.index('type AnalysisAuditOutcome ='):text.index('type AnalysisAuditOutcome =') + 180]:
              raise SystemExit('AnalysisAuditOutcome anchor not found')
          # Normalize the FI call indentation introduced by the patch script.
          text = text.replace(
              '                contextAnchorTokens,\n            keywordLexicalTerms,\n              )',
              '                contextAnchorTokens,\n                keywordLexicalTerms,\n              )',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check and verify gate
        shell: bash
        run: |
          deno check supabase/functions/analyze/index.ts
          python - <<'PY'
          from pathlib import Path
          text = Path('supabase/functions/analyze/index.ts').read_text(encoding='utf-8')
          assert 'function classificationTokenFamilyKey(' in text
          assert 'function keywordIdentityTokenKeys(' in text
          assert 'function hasKeywordLexicalSupport(' in text
          assert 'hasKeywordLexicalSupport(candidate, keywordLexicalTerms)' in text
          assert '| "replay"' in text[text.index('type AnalysisAuditOutcome ='):text.index('type AnalysisAuditOutcome =') + 180]
          lookup = text[text.index('async function lookupAndRankClassifications('):]
          assert lookup.count('keywordLexicalTerms,') >= 4
          PY
          git diff --check

      - name: Commit validated product code only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/analyze/index.ts
          git rm -f .github/workflows/validate-keyword-identity-context-gate.yml
          git rm -f .github/workflows/fix-replay-audit-and-validate.yml
          git commit -m "Validate keyword identity classification gate"
          git push origin HEAD:agent/keyword-identity-context-gate
