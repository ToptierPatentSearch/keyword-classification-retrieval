name: Format analysis progress changes

on:
  push:
    branches:
      - codex/backend-analysis-progress
    paths:
      - scripts/format_analysis_progress.py

permissions:
  contents: write

jobs:
  format-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Normalize focused App formatting
        run: python scripts/format_analysis_progress.py

      - name: Verify frontend build
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify analyze Edge Function
        run: deno check supabase/functions/analyze/index.ts

      - name: Commit formatting cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/App.tsx
          git rm .github/workflows/format-analysis-progress.yml scripts/format_analysis_progress.py
          git commit -m "Clean up analysis progress integration formatting"
          git push origin HEAD:${{ github.ref_name }}
