name: Require lexical and context support

on:
  push:
    branches:
      - agent/context-gate-classifications

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/context-gate-classifications
          fetch-depth: 0

      - name: Enforce lexical plus context gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/functions/analyze/index.ts')
          text = path.read_text(encoding='utf-8')

          old = '''    .filter(
              (candidate) =>
                (candidate.match_score ?? 0) >= 0.38 &&
                candidatePassesContextGate(
                  candidate,
                  contextAnchorTokens,
                  uniqueSearchTerms,
                ),
            )'''
          new = '''    .filter(
              (candidate) =>
                (candidate.match_score ?? 0) >= 0.38 &&
                (candidate.matched_terms?.length ?? 0) > 0 &&
                candidatePassesContextGate(
                  candidate,
                  contextAnchorTokens,
                  uniqueSearchTerms,
                ),
            )'''

          if old in text:
              text = text.replace(old, new, 1)
          elif '(candidate.matched_terms?.length ?? 0) > 0 &&' not in text:
              raise SystemExit('classification candidate filter anchor not found')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify
        shell: bash
        run: |
          grep -n -A10 'match_score ?? 0) >= 0.38' supabase/functions/analyze/index.ts
          git diff --check

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/analyze/index.ts
          git rm .github/workflows/require-lexical-and-context-support.yml
          git commit -m "Require lexical and context classification support"
          git push origin HEAD:agent/context-gate-classifications
