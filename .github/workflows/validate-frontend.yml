name: Validate frontend

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/validate-frontend.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/validate-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run J-PlatPat query regression tests
        run: >-
          deno test
          --unstable-sloppy-imports
          app/src/jPlatPatQuery.test.ts
