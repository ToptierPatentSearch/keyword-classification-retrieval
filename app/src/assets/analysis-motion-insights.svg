<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Animated search-ready patent insights</title>
  <desc id="desc">Structured result rows are assembled and verified for expert review.</desc>
  <style>
    .row { transform-box: fill-box; transform-origin: left center; animation: reveal 3.6s ease-in-out infinite; }
    .row-2 { animation-delay: .35s; }
    .row-3 { animation-delay: .7s; }
    .check { stroke-dasharray: 58; stroke-dashoffset: 58; animation: check 3.6s ease-in-out infinite; }
    .ring { transform-box: fill-box; transform-origin: center; animation: ring 2s ease-in-out infinite; }
    .status-dot { animation: blink 1.2s ease-in-out infinite; }
    @keyframes reveal {
      0%, 10% { transform: scaleX(.08); opacity: .25; }
      38%, 78% { transform: scaleX(1); opacity: 1; }
      100% { transform: scaleX(1); opacity: .55; }
    }
    @keyframes check {
      0%, 35% { stroke-dashoffset: 58; }
      58%, 100% { stroke-dashoffset: 0; }
    }
    @keyframes ring {
      0%, 100% { transform: scale(.94); opacity: .55; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes blink {
      0%, 100% { opacity: .35; }
      50% { opacity: 1; }
    }
  </style>
  <rect width="960" height="420" fill="#f8fafc"/>
  <rect x="46" y="44" width="868" height="332" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="84" y="92" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">SEARCH-READY INSIGHTS</text>
  <text x="84" y="120" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Structuring the result for efficient patent search preparation and review</text>
  <g font-family="Arial, sans-serif">
    <rect x="720" y="78" width="152" height="30" rx="15" fill="#ecfdf5"/>
    <circle class="status-dot" cx="740" cy="93" r="5" fill="#059669"/>
    <text x="756" y="98" font-size="12" font-weight="700" fill="#047857">VERIFYING</text>
  </g>
  <rect x="100" y="158" width="504" height="174" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="126" y="184" width="134" height="18" rx="9" fill="#dbeafe"/>
  <rect x="282" y="184" width="116" height="18" rx="9" fill="#dcfce7"/>
  <rect x="420" y="184" width="152" height="18" rx="9" fill="#ede9fe"/>
  <path d="M126 226 H560 M126 258 H560 M126 290 H560" stroke="#cbd5e1" stroke-width="2"/>
  <rect class="row" x="126" y="216" width="434" height="9" rx="4.5" fill="#64748b"/>
  <rect class="row row-2" x="126" y="248" width="386" height="9" rx="4.5" fill="#94a3b8"/>
  <rect class="row row-3" x="126" y="280" width="412" height="9" rx="4.5" fill="#94a3b8"/>
  <rect x="650" y="170" width="188" height="150" rx="18" fill="#f1f5f9" stroke="#94a3b8"/>
  <circle class="ring" cx="744" cy="222" r="45" fill="#d1fae5" opacity=".65"/>
  <circle cx="744" cy="222" r="38" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <path class="check" d="M725 222 L739 236 L766 207" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="744" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#334155">Structured output</text>
  <text x="744" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Ready for expert review</text>
  <text x="480" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#475569">Technical concept · terms · classification route · rationale</text>
</svg>
